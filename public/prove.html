<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alpha Quest · Primus proof</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#07070c; color:#eef2ff; max-width: 560px; margin: 3rem auto; padding: 0 1rem; }
    .card { background: rgba(16,18,32,.7); border: 1px solid rgba(226,232,240,.12); border-radius: 20px; padding: 1.5rem; }
    h1 { font-size: 1.35rem; margin: .3rem 0 1rem; }
    .muted { color:#94a3b8; font-size:.95rem; line-height:1.5; }
    button { margin-top: 1rem; background: linear-gradient(135deg,#0ea5e9,#6366f1); color:#fff; border:0; border-radius:12px; padding:.75rem 1.1rem; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.4; cursor:not-allowed; }
    .ok { color:#6ee7b7; margin-top:1rem; }
    .err { color:#fca5a5; margin-top:1rem; }
  </style>
</head>
<body>
  <div class="card">
    <p class="muted">Primus extension</p>
    <h1 id="title">Prove follow</h1>
    <p class="muted" id="hint">Stay logged into X. Click Start proof, then keep the orange Primus popup in front until it finishes.</p>
    <div id="status"></div>
    <button id="prove" disabled>Start proof</button>
  </div>
  <script src="/zktls-bundle.js"></script>
  <script>
    const q = new URLSearchParams(location.search);
    const taskId = q.get("task") || "";
    let templateId = q.get("template") || "";
    let handle = (q.get("handle") || "").replace(/^@/, "");
    const statusEl = document.getElementById("status");
    const btn = document.getElementById("prove");
    const titleEl = document.getElementById("title");
    const hintEl = document.getElementById("hint");
    let proveCfg = null;
    let submitted = false;

    function show(msg, kind) {
      statusEl.innerHTML = msg ? '<p class="' + (kind || "") + '">' + msg + "</p>" : "";
    }

    function userByScreenNameUrl(screen) {
      return "https://x.com/i/api/graphql/Gb-d6r0vxPOADdG62OEBpQ/UserByScreenName?variables=" +
        encodeURIComponent(JSON.stringify({ screen_name: screen, withGrokTranslatedBio: false }));
    }

    function swapScreenNameInUrl(url, screen) {
      try {
        const parsed = new URL(url);
        const raw = parsed.searchParams.get("variables");
        if (raw) {
          const variables = JSON.parse(raw);
          variables.screen_name = screen;
          parsed.searchParams.set("variables", JSON.stringify(variables));
          return parsed.toString();
        }
      } catch (e) {}
      return userByScreenNameUrl(screen);
    }

    function retargetFollowRequest(unsigned, screen) {
      if (!screen) return unsigned;
      let parsed;
      try { parsed = JSON.parse(unsigned); } catch (e) { return unsigned; }
      const existingUrl = parsed.request && parsed.request.url;
      parsed.request = {
        url: existingUrl ? swapScreenNameInUrl(existingUrl, screen) : userByScreenNameUrl(screen),
        method: "GET",
        header: "",
        body: ""
      };
      parsed.reponseResolve = [
        { keyName: "screen_name", parseType: "", parsePath: "$.data.user.result.core.screen_name" },
        { keyName: "following", parseType: "", parsePath: "$.data.user.result.relationship_perspectives.following" }
      ];
      return JSON.stringify(parsed);
    }

    function setHandleTitle(screen) {
      if (!screen) return;
      titleEl.textContent = "Prove you follow @" + screen;
      hintEl.textContent = "Stay logged into X. Primus will prove a follow of @" + screen +
        " — one Hub template is reused for every X account. Keep the orange popup in front until it finishes.";
    }
    if (handle) setHandleTitle(handle);

    (async function ready() {
      try {
        const me = await fetch("/api/auth/me", { credentials: "include" }).then((r) => r.json());
        if (!me.user) {
          show("Log in on Alpha Quest first, then open this page again.", "err");
          return;
        }
        if (taskId) {
          const cfgRes = await fetch("/api/tasks/" + encodeURIComponent(taskId) + "/prove", { credentials: "include" });
          proveCfg = await cfgRes.json();
          if (cfgRes.ok) {
            if (proveCfg.handle) handle = proveCfg.handle;
            if (proveCfg.templateId) templateId = proveCfg.templateId;
            setHandleTitle(handle);
          }
        }
        if (!templateId) {
          const primusCfg = await fetch("/api/primus/config", { credentials: "include" }).then((r) => r.json());
          templateId = primusCfg.followTemplateId || "";
        }
        if (!templateId) {
          show("Primus is missing the shared X follow template. Set PRIMUS_TEMPLATE_X_FOLLOW — one UserByScreenName template works for every X handle.", "err");
          return;
        }
        if (typeof window.PrimusZKTLS !== "function" && typeof window.VoiceSenseZKTLS !== "function") {
          show("Primus SDK missing. Refresh, and make sure the Primus extension is installed.", "err");
          return;
        }
        btn.disabled = false;
        btn.onclick = function () { run(me.user); };
      } catch (e) {
        show(String(e && e.message || e), "err");
      }
    })();

    async function submitProof(task, attestation) {
      if (submitted || !attestation) return;
      submitted = true;
      const verifyRes = await fetch("/api/tasks/" + encodeURIComponent(task) + "/verify", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ attestation: attestation }),
      });
      const verifyJson = await verifyRes.json();
      if (!verifyRes.ok) {
        submitted = false;
        throw new Error(verifyJson.error || "Quest rejected the proof");
      }
      show("Verified. You can close this tab and return to Alpha Quest.", "ok");
      try {
        if (window.opener && !window.opener.closed) window.opener.focus();
      } catch (e) {}
    }

    async function run(user) {
      btn.disabled = true;
      submitted = false;
      show("Opening Primus extension… keep the popup in front.", "ok");
      try {
        const cfg = await fetch("/api/primus/config", { credentials: "include" }).then((r) => r.json());
        if (!cfg.appId) throw new Error("Primus app is not configured");
        const Ctor = window.PrimusZKTLS || window.VoiceSenseZKTLS;
        const zk = new Ctor();
        await zk.init(cfg.appId);
        const request = zk.generateRequestParams(templateId, user.boundAddress);
        request.setAdditionParams(JSON.stringify({
          taskId: taskId,
          userId: user.id,
          handle: handle,
          profileUrl: handle ? ("https://x.com/" + handle) : ""
        }));
        request.setAttMode({ algorithmType: "proxytls" });
        if (typeof request.setAllJsonResponseFlag === "function") {
          request.setAllJsonResponseFlag("true");
        } else {
          request.allJsonResponseFlag = "true";
        }
        if (handle) {
          const screen = handle;
          const existing = request.request && request.request.url;
          request.request = {
            url: existing ? swapScreenNameInUrl(existing, screen) : (proveCfg && proveCfg.request && proveCfg.request.url) || userByScreenNameUrl(screen),
            method: "GET",
            header: "",
            body: ""
          };
          request.reponseResolve = [
            { keyName: "screen_name", parseType: "", parsePath: "$.data.user.result.core.screen_name" },
            { keyName: "following", parseType: "", parsePath: "$.data.user.result.relationship_perspectives.following" }
          ];
        }
        let unsigned = request.toJsonString();
        if (handle) unsigned = retargetFollowRequest(unsigned, handle);
        const signedRes = await fetch("/api/primus/sign", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ signParams: unsigned, taskId: taskId }),
        });
        const signedJson = await signedRes.json();
        if (!signedRes.ok) throw new Error(signedJson.error || "Sign failed");
        const attestation = await zk.startAttestation(signedJson.signResult);
        if (!attestation) throw new Error("Empty proof");
        await submitProof(taskId, attestation);
      } catch (e) {
        show((e && e.message) || String(e), "err");
        btn.disabled = false;
        btn.textContent = "Try again";
      }
    }
  </script>
</body>
</html>
