<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alpha Quest · Primus proof</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#07070c; color:#eef2ff; max-width: 560px; margin: 3rem auto; padding: 0 1rem; }
    .card { background: rgba(16,18,32,.7); border: 1px solid rgba(226,232,240,.12); border-radius: 20px; padding: 1.5rem; }
    h1 { font-size: 1.35rem; margin: .3rem 0 1rem; }
    .muted { color:#94a3b8; font-size:.95rem; line-height:1.5; }
    button { margin-top: 1rem; background: linear-gradient(135deg,#0ea5e9,#6366f1); color:#fff; border:0; border-radius:12px; padding:.75rem 1.1rem; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.4; cursor:not-allowed; }
    .ok { color:#6ee7b7; margin-top:1rem; }
    .err { color:#fca5a5; margin-top:1rem; }
    a { color:#7dd3fc; }
  </style>
</head>
<body>
  <div class="card">
    <p class="muted">Primus extension</p>
    <h1 id="title">Prove follow</h1>
    <p class="muted" id="hint">Stay logged into X in this Chrome profile. Click Start proof, then keep the orange Primus popup in front until it finishes.</p>
    <div id="status"></div>
    <button id="prove" disabled>Start proof</button>
  </div>
  <script src="/zktls-bundle.js"></script>
  <script>
    const q = new URLSearchParams(location.search);
    const taskId = q.get("task") || "";
    let templateId = q.get("template") || "";
    let handle = (q.get("handle") || "").replace(/^@/, "");
    const statusEl = document.getElementById("status");
    const btn = document.getElementById("prove");
    const titleEl = document.getElementById("title");
    const hintEl = document.getElementById("hint");
    let proveCfg = null;
    let submitted = false;

    const FEATURES = {
      hidden_profile_subscriptions_enabled: true,
      profile_label_improvements_pcf_label_in_post_enabled: true,
      responsive_web_profile_redirect_enabled: false,
      rweb_tipjar_consumption_enabled: true,
      verified_phone_label_enabled: false,
      subscriptions_verification_info_is_identity_verified_enabled: true,
      subscriptions_verification_info_verified_since_enabled: true,
      highlights_tweets_tab_ui_enabled: true,
      responsive_web_twitter_article_notes_tab_enabled: true,
      subscriptions_feature_can_gift_premium: true,
      creator_subscriptions_tweet_preview_api_enabled: true,
      responsive_web_graphql_skip_user_profile_image_extensions_enabled: false,
      responsive_web_graphql_timeline_navigation_enabled: true
    };
    const FIELD_TOGGLES = { withPayments: false, withAuxiliaryUserLabels: true };

    function show(msg, kind) {
      statusEl.innerHTML = msg ? '<p class="' + (kind || "") + '">' + msg + "</p>" : "";
    }

    function userByScreenNameUrl(screen) {
      const variables = JSON.stringify({ screen_name: screen, withGrokTranslatedBio: false });
      return "https://x.com/i/api/graphql/Gb-d6r0vxPOADdG62OEBpQ/UserByScreenName" +
        "?variables=" + encodeURIComponent(variables) +
        "&features=" + encodeURIComponent(JSON.stringify(FEATURES)) +
        "&fieldToggles=" + encodeURIComponent(JSON.stringify(FIELD_TOGGLES));
    }

    function swapScreenNameInUrl(url, screen) {
      try {
        const parsed = new URL(url);
        const raw = parsed.searchParams.get("variables");
        if (raw) {
          const variables = JSON.parse(raw);
          variables.screen_name = screen;
          parsed.searchParams.set("variables", JSON.stringify(variables));
          if (!parsed.searchParams.get("features")) {
            parsed.searchParams.set("features", JSON.stringify(FEATURES));
          }
          if (!parsed.searchParams.get("fieldToggles")) {
            parsed.searchParams.set("fieldToggles", JSON.stringify(FIELD_TOGGLES));
          }
          return parsed.toString();
        }
      } catch (e) {}
      return userByScreenNameUrl(screen);
    }

    function retargetFollowRequest(unsigned, screen) {
      if (!screen) return unsigned;
      let parsed;
      try { parsed = JSON.parse(unsigned); } catch (e) { return unsigned; }
      const existing = parsed.request || {};
      const existingUrl = existing.url || "";
      parsed.request = {
        url: existingUrl ? swapScreenNameInUrl(existingUrl, screen) : userByScreenNameUrl(screen),
        method: existing.method || "GET",
        header: typeof existing.header === "string" ? existing.header : "",
        body: typeof existing.body === "string" ? existing.body : ""
      };
      return JSON.stringify(parsed);
    }

    function friendlyError(err) {
      const msg = (err && err.message) || (typeof err === "string" ? err : "");
      const code = (err && err.code) || "";
      const blob = (code + " " + msg).toLowerCase();
      if (blob.indexOf("00013") >= 0 || blob.indexOf("no verifiable data") >= 0) {
        return "Primus could not read X. In this same Chrome profile stay logged into X, open " +
          (handle ? ("x.com/" + handle) : "x.com") +
          ", then click Try again. Keep the orange popup in front — do not switch accounts.";
      }
      if (blob.indexOf("00006") >= 0 || blob.indexOf("extension not detected") >= 0) {
        return "Install and enable the Primus Chrome extension, then try again.";
      }
      if (blob.indexOf("session expired") >= 0 || blob.indexOf("30001:401") >= 0) {
        return "Your X login expired. Log into X in this Chrome profile, then try again.";
      }
      return msg || String(err);
    }

    function setHandleTitle(screen) {
      if (!screen) return;
      titleEl.textContent = "Prove you follow @" + screen;
      hintEl.innerHTML = "Stay logged into X in this Chrome profile. A tab to " +
        '<a href="https://x.com/' + screen + '" target="alpha-quest-x-profile" rel="noreferrer">x.com/' + screen + "</a>" +
        " may open so Primus can read the follow. Keep the orange popup in front until it finishes.";
    }
    if (handle) setHandleTitle(handle);

    (async function ready() {
      try {
        const me = await fetch("/api/auth/me", { credentials: "include" }).then((r) => r.json());
        if (!me.user) {
          show("Log in on Alpha Quest first, then open this page again.", "err");
          return;
        }
        if (taskId) {
          const cfgRes = await fetch("/api/tasks/" + encodeURIComponent(taskId) + "/prove", { credentials: "include" });
          proveCfg = await cfgRes.json();
          if (cfgRes.ok) {
            if (proveCfg.handle) handle = proveCfg.handle;
            if (proveCfg.templateId) templateId = proveCfg.templateId;
            setHandleTitle(handle);
          }
        }
        if (!templateId) {
          const primusCfg = await fetch("/api/primus/config", { credentials: "include" }).then((r) => r.json());
          templateId = primusCfg.followTemplateId || "";
        }
        if (!templateId) {
          show("Primus is missing the shared X follow template.", "err");
          return;
        }
        if (typeof window.PrimusZKTLS !== "function" && typeof window.VoiceSenseZKTLS !== "function") {
          show("Primus SDK missing. Refresh, and make sure the Primus extension is installed.", "err");
          return;
        }
        btn.disabled = false;
        btn.onclick = function () { run(me.user); };
      } catch (e) {
        show(String(e && e.message || e), "err");
      }
    })();

    async function submitProof(task, attestation) {
      if (submitted || !attestation) return;
      submitted = true;
      const verifyRes = await fetch("/api/tasks/" + encodeURIComponent(task) + "/verify", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ attestation: attestation }),
      });
      const verifyJson = await verifyRes.json();
      if (!verifyRes.ok) {
        submitted = false;
        throw new Error(verifyJson.error || "Quest rejected the proof");
      }
      show("Verified. You can close this tab and return to Alpha Quest.", "ok");
      try {
        if (window.opener && !window.opener.closed) window.opener.focus();
      } catch (e) {}
    }

    async function run(user) {
      btn.disabled = true;
      submitted = false;
      show("Opening Primus extension… keep the popup in front.", "ok");
      try {
        if (handle) {
          try { window.open("https://x.com/" + handle, "alpha-quest-x-profile"); } catch (e) {}
        }
        const cfg = await fetch("/api/primus/config", { credentials: "include" }).then((r) => r.json());
        if (!cfg.appId) throw new Error("Primus app is not configured");
        const Ctor = window.PrimusZKTLS || window.VoiceSenseZKTLS;
        const zk = new Ctor();
        await zk.init(cfg.appId);
        const request = zk.generateRequestParams(templateId, user.boundAddress);
        request.setAdditionParams(JSON.stringify({
          taskId: taskId,
          userId: user.id,
          handle: handle,
          profileUrl: handle ? ("https://x.com/" + handle) : ""
        }));
        request.setAttMode({ algorithmType: "proxytls" });
        if (typeof request.setAllJsonResponseFlag === "function") {
          request.setAllJsonResponseFlag("true");
        } else {
          request.allJsonResponseFlag = "true";
        }
        if (handle) {
          const existingUrl = request.request && request.request.url;
          const fromCfg = proveCfg && proveCfg.request && proveCfg.request.url;
          request.request = {
            url: existingUrl
              ? swapScreenNameInUrl(existingUrl, handle)
              : (fromCfg ? swapScreenNameInUrl(fromCfg, handle) : userByScreenNameUrl(handle)),
            method: "GET",
            header: "",
            body: ""
          };
        }
        let unsigned = request.toJsonString();
        if (handle) unsigned = retargetFollowRequest(unsigned, handle);
        const signedRes = await fetch("/api/primus/sign", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ signParams: unsigned, taskId: taskId }),
        });
        const signedJson = await signedRes.json();
        if (!signedRes.ok) throw new Error(signedJson.error || "Sign failed");
        const attestation = await zk.startAttestation(signedJson.signResult);
        if (!attestation) throw new Error("Empty proof");
        await submitProof(taskId, attestation);
      } catch (e) {
        show(friendlyError(e), "err");
        btn.disabled = false;
        btn.textContent = "Try again";
      }
    }
  </script>
</body>
</html>
