<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alpha Quest · Primus proof</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#07070c; color:#eef2ff; max-width: 560px; margin: 3rem auto; padding: 0 1rem; }
    .card { background: rgba(16,18,32,.7); border: 1px solid rgba(226,232,240,.12); border-radius: 20px; padding: 1.5rem; }
    h1 { font-size: 1.35rem; margin: .3rem 0 1rem; }
    .muted { color:#94a3b8; font-size:.95rem; line-height:1.5; }
    button { margin-top: 1rem; background: linear-gradient(135deg,#0ea5e9,#6366f1); color:#fff; border:0; border-radius:12px; padding:.75rem 1.1rem; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.4; cursor:not-allowed; }
    .ok { color:#6ee7b7; margin-top:1rem; }
    .err { color:#fca5a5; margin-top:1rem; }
  </style>
</head>
<body>
  <div class="card">
    <p class="muted">Primus extension</p>
    <h1 id="title">Prove with Primus</h1>
    <p class="muted" id="hint">Stay logged into X in this Chrome profile. Click Start proof, then keep the orange Primus popup in front until it finishes.</p>
    <div id="status"></div>
    <button id="prove" disabled>Start proof</button>
  </div>
  <script src="/zktls-bundle.js"></script>
  <script>
    const q = new URLSearchParams(location.search);
    const taskId = q.get("task") || "";
    let templateId = q.get("template") || "";
    let handle = (q.get("handle") || "").replace(/^@/, "");
    const statusEl = document.getElementById("status");
    const btn = document.getElementById("prove");
    const titleEl = document.getElementById("title");
    const hintEl = document.getElementById("hint");
    let submitted = false;
    let zkHandle = null;
    let requestid = null;

    function show(msg, kind) {
      statusEl.innerHTML = msg ? '<p class="' + (kind || "") + '">' + msg + "</p>" : "";
    }

    function friendlyError(err) {
      const msg = (err && err.message) || (typeof err === "string" ? err : "");
      const code = (err && err.code) || "";
      const blob = (code + " " + msg).toLowerCase();
      if (blob.indexOf("00013") >= 0 || blob.indexOf("no verifiable data") >= 0) {
        return "Primus could not read X. Stay logged into X in this same Chrome profile, follow the account if you have not, keep the orange popup in front, then Try again.";
      }
      if (blob.indexOf("00006") >= 0 || blob.indexOf("extension not detected") >= 0) {
        return "Install and enable the Primus Chrome extension, then try again.";
      }
      if (blob.indexOf("session expired") >= 0 || blob.indexOf("30001:401") >= 0) {
        return "Your X login expired. Log into X in this Chrome profile, then try again.";
      }
      if (blob.indexOf("timeout") >= 0 || blob.indexOf("interrupt") >= 0 || blob.indexOf("timed out") >= 0) {
        return "Connection dropped before Primus finished. Keep the popup in front, stay on this tab, then click Try again.";
      }
      return msg || String(err);
    }

    if (handle) {
      titleEl.textContent = "Prove you follow @" + handle;
      hintEl.textContent = "Stay logged into X. Follow @" + handle + " if you have not. Click Start proof and keep the orange Primus popup in front until it finishes.";
    }

    (async function ready() {
      try {
        const me = await fetch("/api/auth/me", { credentials: "include" }).then((r) => r.json());
        if (!me.user) {
          show("Log in on Alpha Quest first, then open this page again.", "err");
          return;
        }
        if (taskId) {
          const cfgRes = await fetch("/api/tasks/" + encodeURIComponent(taskId) + "/prove", { credentials: "include" });
          const proveCfg = await cfgRes.json();
          if (cfgRes.ok) {
            if (proveCfg.handle) handle = proveCfg.handle;
            if (proveCfg.templateId) templateId = proveCfg.templateId;
            if (handle) {
              titleEl.textContent = "Prove you follow @" + handle;
              hintEl.textContent = "Stay logged into X. Follow @" + handle + " if you have not. Click Start proof and keep the orange Primus popup in front until it finishes.";
            }
          }
        }
        if (!templateId) {
          const primusCfg = await fetch("/api/primus/config", { credentials: "include" }).then((r) => r.json());
          templateId = primusCfg.followTemplateId || "";
        }
        if (!templateId) {
          show("This quest has no Primus Hub template.", "err");
          return;
        }
        if (typeof window.PrimusZKTLS !== "function" && typeof window.VoiceSenseZKTLS !== "function") {
          show("Primus SDK missing. Refresh, and make sure the Primus extension is installed.", "err");
          return;
        }
        btn.disabled = false;
        btn.onclick = function () { run(me.user); };
        show("Extension ready. Click Start proof.", "ok");
      } catch (e) {
        show(String(e && e.message || e), "err");
      }
    })();

    async function submitProof(task, attestation) {
      if (submitted || !attestation) return;
      submitted = true;
      let extras = {};
      try {
        const rid = attestation.requestid || requestid;
        if (rid && zkHandle && typeof zkHandle.getAllJsonResponse === "function") {
          extras.allJsonResponse = zkHandle.getAllJsonResponse(rid);
        }
        if (rid && zkHandle && typeof zkHandle.getPrivateData === "function") {
          extras.privateData = zkHandle.getPrivateData(rid);
        }
      } catch (e) {}
      const verifyRes = await fetch("/api/tasks/" + encodeURIComponent(task) + "/verify", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ attestation: attestation, extras: extras }),
      });
      const verifyJson = await verifyRes.json();
      if (!verifyRes.ok) {
        submitted = false;
        throw new Error(verifyJson.error || "Quest rejected the proof");
      }
      show("Verified. You can close this tab and return to Alpha Quest.", "ok");
      try {
        if (window.opener && !window.opener.closed) window.opener.focus();
      } catch (e) {}
    }

    async function run(user) {
      btn.disabled = true;
      submitted = false;
      show("Starting zkTLS… keep the Primus extension popup in view.", "ok");
      try {
        const cfg = await fetch("/api/primus/config", { credentials: "include" }).then((r) => r.json());
        if (!cfg.appId) throw new Error("Primus app is not configured");
        const Ctor = window.PrimusZKTLS || window.VoiceSenseZKTLS;
        const zk = new Ctor();
        zkHandle = zk;
        await zk.init(cfg.appId);
        const request = zk.generateRequestParams(templateId, user.boundAddress);
        request.setAttMode({ algorithmType: "proxytls" });
        request.setAdditionParams(JSON.stringify({
          taskId: taskId,
          userId: user.id,
          handle: handle
        }));
        if (typeof request.setAllJsonResponseFlag === "function") {
          request.setAllJsonResponseFlag("true");
        } else {
          request.allJsonResponseFlag = "true";
        }
        const unsigned = request.toJsonString();
        const signedRes = await fetch("/api/primus/sign", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ signParams: unsigned, taskId: taskId }),
        });
        const signedJson = await signedRes.json();
        if (!signedRes.ok) throw new Error(signedJson.error || "Sign failed");
        const signed =
          typeof signedJson.signResult === "string"
            ? signedJson.signResult
            : JSON.stringify(signedJson.signResult);
        try {
          requestid = JSON.parse(signed).attRequest.requestid || null;
        } catch (e) {}
        const attestation = await zk.startAttestation(signed);
        if (!attestation) throw new Error("Empty proof");
        await submitProof(taskId, attestation);
      } catch (e) {
        show(friendlyError(e), "err");
        btn.disabled = false;
        btn.textContent = "Try again";
      }
    }
  </script>
</body>
</html>
